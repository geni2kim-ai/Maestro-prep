name: Candidate-only offline verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout candidate code (no retained credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify package + O-Prep pin + unit suites + replay guards
        run: python tools/ci_check.py

