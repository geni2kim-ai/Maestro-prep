name: Candidate-only offline verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-profile:
    name: Main public profile / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout source without retained credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install strict type checker
        run: python -m pip install --disable-pip-version-check mypy==1.18.2
      - name: Strict type check for offline verification gate (component)
        env:
          MYPYPATH: components/o_prep_v0_3/src
        run: python -m mypy --strict --cache-dir "${{ runner.temp }}/mypy-cache" maestro_prep/coordinator.py maestro_prep/cli.py components/o_prep_v0_3/src/o_prep.py components/o_prep_v0_3/src/evidence_bindings.py
      - name: Verify public payload and synthetic regression checks
        run: python .github/scripts/main_ci.py

  full-source-bundle:
    name: Verified full tracked-source snapshot (non-deployable)
    needs: public-profile
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build complete pinned tracked-source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/full-source"
          git archive --format=zip --output="$RUNNER_TEMP/full-source/maestro-prep-full-source.zip" HEAD
          cd "$RUNNER_TEMP/full-source"
          sha256sum maestro-prep-full-source.zip > SOURCE_SHA256.txt
          printf '%s\n' "${GITHUB_SHA}" > SOURCE_COMMIT.txt
          cat SOURCE_SHA256.txt
      - name: Upload source and digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-prep-complete-source-${{ github.sha }}
          path: ${{ runner.temp }}/full-source/
          if-no-files-found: error
          retention-days: 30
