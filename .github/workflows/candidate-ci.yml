name: Candidate-only offline verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout candidate code (no retained credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify package + O-Prep pin + unit suites + replay guards
        run: python tools/ci_check.py

  public-astra-reference:
    name: Public Astra reference conformance (NOT node approval)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ASTRA_PUBLIC_COMMIT: '54b0444002613309a6a47af281aa70f69202bd6d'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Fetch immutable public Astra reference (not the approved node install)
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/astra-reference"
          git -C "$RUNNER_TEMP/astra-reference" -c protocol.version=2 fetch --depth 1 https://github.com/geni2kim-ai/astra-prep.git "$ASTRA_PUBLIC_COMMIT"
          git -C "$RUNNER_TEMP/astra-reference" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/astra-reference" rev-parse HEAD)" = "$ASTRA_PUBLIC_COMMIT"
      - name: Install Astra public reference test-only dependency
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Run real public Astra's own pytest suite
        shell: bash
        run: (cd "$RUNNER_TEMP/astra-reference" && python -m pytest tests -q)
      - name: Verify reference manifest and real public validator through Maestro adapter
        shell: bash
        run: python tools/public_astra_reference_smoke.py "$RUNNER_TEMP/astra-reference" --commit "$ASTRA_PUBLIC_COMMIT"

  public-astra-mirror-audit:
    name: Public Astra mirror audit — known drift remains HOLD
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ASTRA_PUBLIC_COMMIT: '54b0444002613309a6a47af281aa70f69202bd6d'
    steps:
      - name: Checkout candidate source without retained Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run independent read-only mirror audit regressions
        run: python -m unittest discover -s tests -p test_public_mirror_audit.py -q
      - name: Fetch immutable public source mirror (no node authorization)
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/astra-mirror-audit"
          git -C "$RUNNER_TEMP/astra-mirror-audit" fetch --depth 1 https://github.com/geni2kim-ai/astra-prep.git "$ASTRA_PUBLIC_COMMIT"
          git -C "$RUNNER_TEMP/astra-mirror-audit" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/astra-mirror-audit" rev-parse HEAD)" = "$ASTRA_PUBLIC_COMMIT"
      - name: Audit listed bytes, pinned mismatch hashes and clean checkout (V2 HOLD)
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_public_mirror.py --root "$RUNNER_TEMP/astra-mirror-audit" \
            --known-drift-policy tools/expected_public_mirror_drift.json \
            --report "$RUNNER_TEMP/public_mirror_audit.json"
          python - "$RUNNER_TEMP/public_mirror_audit.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding='utf-8') as f: data=json.load(f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Public Astra mirror — audit-only, NOT node approval\n')
              f.write(f"Published manifest status: **{data['status']}**; mismatches: **{data['mismatch_count']}**\n\n")
              kd=data['known_drift']
              f.write(f"Classification: **{kd['status']}**; exact mismatch bytes: **{kd['exact_mismatch_bytes']}**.\n")
              f.write(f"Pinned checkout: **{kd['checkout_bound_to_commit']}**; clean tree: **{kd['source_worktree_clean']}**; repeat snapshot: **{kd['audit_snapshot_stable']}**.\n")
              f.write('This job does not establish approved node authority or source-integrity PASS.\n')
          PY
